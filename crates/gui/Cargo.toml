[package]
name = "the-blockheads-tools-gui"
version = "0.1.0"
edition = "2024"

[features]
default = []
web = ["dep:wasm-bindgen-futures", "dep:wasm-bindgen", "dep:js-sys"]

[dependencies]
eframe = { workspace = true, features = ["wayland", "x11"] }
wgpu = { workspace = true, features = ["dx12", "metal", "vulkan", "gles", "wgsl"] }
bytemuck = { version = "1.12", features = ["derive"] }
ab_glyph = "0.2.32"
glam = { version = "0.30.4", features = ["bytemuck"] }
the-blockheads-tools-lib = { workspace = true }
wgsl_macro = { workspace = true }
env_logger = "0.11.8"
log = "0.4.27"
zune-png = "0.4.10"
rfd = "0.15.3"
rayon = "1.11.0"
wasm-bindgen-futures = { workspace = true, optional = true }
wasm-bindgen = { version = "0.2.108", optional = true }
js-sys = { version = "0.3.85", optional = true }
snafu = { workspace = true }
num_enum = { workspace = true }
strum = { workspace = true }
